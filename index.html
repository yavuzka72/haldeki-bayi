<!DOCTYPE html>
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDqFJmcTbAX6krgJNQJNCf2MITfUDjpxPA&libraries=places">
</script>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <script>
    // Static host'ta path ile gelindiyse (örn: /orders), hash route'a çevir.
    // Base path altında yayınlandığında da doğru çalışsın (örn: /admin/).
    (function () {
      var p = window.location.pathname || '';
      var q = window.location.search || '';
      var b = document.querySelector('base');
      var base = (b && b.getAttribute('href')) ? b.getAttribute('href') : '/';
      if (!base.startsWith('/')) base = '/' + base;
      if (!base.endsWith('/')) base = base + '/';
      var normP = p;
      if (base !== '/' && p.indexOf(base) === 0) {
        normP = p.substring(base.length - 1); // '/orders' gibi
      }
      if (normP.length > 1 && normP !== '/index.html' && !window.location.hash) {
        window.location.replace(base + '#' + normP + q);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="haldeki_admin_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Haldeki Bayi Paneli</title>
  <link rel="manifest" href="manifest.json">

</head>
<body>
  <script>
    // Eski Flutter PWA service worker'i bazen eski main.dart.js'i tutabiliyor.
    // Bu panelde en guncel build'in acilmasi oncelikli oldugu icin temizleyip baslatiyoruz.
    (async function clearOldFlutterCaches() {
      try {
        if ('serviceWorker' in navigator) {
          var registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          }));
        }

        if (window.caches) {
          var keys = await caches.keys();
          await Promise.all(keys
            .filter(function (key) {
              return key.indexOf('flutter-') === 0;
            })
            .map(function (key) {
              return caches.delete(key);
            }));
        }
      } catch (_) {}

      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + Date.now();
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
